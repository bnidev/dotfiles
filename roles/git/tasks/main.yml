---
- name: "{{ role_name }} | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distribution_config
  changed_when: false

- name: "{{ role_name }} | Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distribution_config.stat.exists

- name: "Git | Set user.name"
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git.default.name }}"
  when: git.default.name is defined

- name: "Git | Set user.email"
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git.default.email }}"
  no_log: true
  when: git.default.email is defined

- name: "Git | Include default config"
  blockinfile:
    prepend_newline: true
    path: "{{ lookup('env', 'HOME') }}/.config/git/config"
    block: |
      [include]
      path = "{{ role_path }}/files/.gitconfig"
    marker: "# {mark} ANSIBLE BLOCK: {{ role_name }} | Include default config"
    create: true

- name: Create Git configuration function in fish config
  blockinfile:
    prepend_newline: true
    path: "{{ lookup('env', 'HOME') }}/.config/fish/parts/git.fish"
    block: "{{ lookup('template', role_path + '/templates/git_config_block.j2') }}"
    marker: "# {mark} ANSIBLE BLOCK: {{ role_name }} | Create Git configuration function in fish config"
    create: yes
    state: present
