---
- name: "{{ role_name }} | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: distribution_config

- name: "{{ role_name }} | Run Tasks: {{ ansible_facts['distribution'] }}"
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: distribution_config.stat.exists

- name: "{{ role_name }} | Find files to copy"
  ansible.builtin.find:
    path: "{{ role_path }}/files"
    file_type: file
  register: ghostty_files

- name: "{{ role_name }} | Copy files"
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/{{ item.path | basename }}"
    src: "{{ item.path | basename }}"
    mode: "0644"
    force: true
  loop: "{{ ghostty_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
