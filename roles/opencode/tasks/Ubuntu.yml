---
- name: "opencode | Check if already installed"
  ansible.builtin.command: which opencode
  register: opencode_check
  changed_when: false
  failed_when: false

- name: "opencode | {{ ansible_distribution }} | Install via curl script"
  ansible.builtin.shell: curl -fsSL https://opencode.ai/install | bash
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/opencode"
  when: opencode_check.rc != 0
