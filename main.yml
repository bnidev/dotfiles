---
- name: DotFiles Config
  hosts: localhost

  pre_tasks:
  - name: Detect WSL
    ansible.builtin.import_tasks: pre_tasks/detect_wsl.yml
    tags:
      - always

  - name: Detect WSL Host User
    ansible.builtin.import_tasks: pre_tasks/whoami_wsl.yml
    when: ansible_host_environment_is_wsl
    tags:
      - always

  - name: Detect Host User
    ansible.builtin.import_tasks: pre_tasks/whoami.yml
    tags:
      - always

  tasks:
    - name: Set roles dynamically
      ansible.builtin.set_fact:
        run_roles: "{{ ansible_run_tags != ['all'] and ansible_run_tags or default_roles | difference(exclude_roles | default([])) | sort }}"
      tags:
        - always

    - name: Add work roles if defined
      ansible.builtin.set_fact:
        run_roles: "{{ run_roles + work_roles | default([]) }}"
      when: work | default(false)
      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always
